<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pakistan — provinces, and the proposals to redraw them</title>
    <meta
      name="description"
      content="The administrative map of Pakistan as it stands — provinces, territories and divisions, pinned to the 2023 census — and curated, sourced proposals to redraw it, each drawn against its own evidence."
    />
  </head>
  <body>
    <main id="app">
      <header class="masthead">
        <h1>Pakistan</h1>
        <p class="dek">Provinces, territories and divisions as they stand — and the proposals to
          redraw them</p>
      </header>

      <nav id="controls" class="controls-well" aria-label="What the map shows"></nav>

      <figure class="frame">
        <div id="map" class="map-well"></div>
        <figcaption class="legend" id="legend"></figcaption>
      </figure>

      <aside class="card-well" id="card" aria-label="The variant on screen" hidden></aside>

      <footer class="colophon" id="colophon"></footer>

      <!--
        The audit surface (#21). A `details` rather than a dialog or a route: it needs no
        JavaScript to open, no hover to discover and no width to fit, which is what makes it work
        at 390px — and it is closed by default because it is the reference behind the map, not the
        map. It sits under the colophon, which is the short form of the same claim.
      -->
      <section class="about-well" id="about"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
