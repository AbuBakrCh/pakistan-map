<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pakistan — provinces, and the proposals to redraw them</title>
    <meta
      name="description"
      content="The administrative map of Pakistan as it stands — provinces, territories and divisions, pinned to the 2023 census — and curated, sourced proposals to redraw it, each drawn against its own evidence."
    />
  </head>
  <body>
    <main id="app">
      <header class="masthead">
        <h1>Pakistan</h1>
        <p class="dek">Provinces, territories and divisions as they stand — and the proposals to
          redraw them</p>
      </header>

      <nav id="controls" class="controls-well" aria-label="What the map shows"></nav>

      <figure class="frame">
        <div id="map" class="map-well">
          <!--
            The one control that sits on the map itself: whether the division tier is drawn. It is
            here rather than in the controls well because it is not part of the selection — it does
            not choose what is argued, only how much of the administrative map it is argued over —
            and because a control that changes the paper belongs on the paper.
          -->
          <div id="map-controls" class="map-controls"></div>

          <!--
            Stratum 1's key, on the paper, under the division toggle: which colour is which mother
            tongue, or which band of the development composite. The legend below the frame says the
            same thing and says it in full — this is the half a reader matches to the ground while
            still looking at the ground, which is what a fill key is for.

            Empty and gone under a basis that shades nothing, exactly as the unit key is empty at
            the baseline: three of the four bases can be selected and paint no district, and a key
            to a fill the map never drew explains a picture that does not exist.

            `aria-hidden` for the reason the unit key is: the legend under the frame carries these
            same rows, in the same words, and a screen reader given both is given every colour
            twice.
          -->
          <div id="fill-key" class="fill-key" aria-hidden="true"></div>

          <!--
            The map's own key to stratum 3: how many units the active variant cuts the country
            into, and which unit is which, in its outline's own stroke. It sits on the paper
            because that is where the outlines are — the legend under the frame says what a stroke
            *means*, and this says whose boundary it is.

            Empty and gone at the baseline, exactly as the card and the outlines are (#19): the
            current map proposes nothing, and there is nothing here to name.

            `aria-hidden`, and that is a decision rather than an oversight. The map already names
            every region in words for a screen reader (#35, `lib/regions.ts`), with each unit's
            constitutional standing beside it; this is the same list with less in it, and reading
            it out again would give a reader the units twice and the standing once.
          -->
          <div id="unit-key" class="unit-key" aria-hidden="true"></div>
        </div>
        <figcaption class="legend" id="legend"></figcaption>
      </figure>

      <aside class="card-well" id="card" aria-label="The variant on screen" hidden></aside>

      <footer class="colophon" id="colophon"></footer>

      <!--
        The audit surface (#21). A `details` rather than a dialog or a route: it needs no
        JavaScript to open, no hover to discover and no width to fit, which is what makes it work
        at 390px — and it is closed by default because it is the reference behind the map, not the
        map. It sits under the colophon, which is the short form of the same claim.
      -->
      <section class="about-well" id="about"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
