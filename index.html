<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pakistan — provinces, and the proposals to redraw them</title>
    <meta
      name="description"
      content="The administrative map of Pakistan as it stands — provinces, territories and divisions, pinned to the 2023 census — and curated, sourced proposals to redraw it, each drawn against its own evidence."
    />

    <!--
      The stylesheet, linked here rather than `import`ed by `main.ts`.

      It used to be the module's, which cost nothing in a production build — Vite extracts it and
      the browser fetches both in parallel — and cost everything in development, where the CSS is
      injected *by the script*. That is the same three-megabyte script the waiting note below
      exists to cover, so the page a reader met while waiting for it was the page with no styles
      at all: a Times-Roman masthead and the note in the top-left corner of a blank document.

      Linked, it is a second request the browser starts in the same breath as the script and
      finishes long before it, so the frame, the paper and the note are dressed by the first
      paint. It is also render-blocking, which is the trade and is the right way round here: the
      stylesheet is small, and the alternative is showing the reader an unstyled page rather than
      showing them nothing for a few more milliseconds.
    -->
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app">
      <header class="masthead">
        <h1>Pakistan</h1>
        <p class="dek">Provinces, territories and divisions as they stand — and the proposals to
          redraw them</p>
      </header>

      <nav id="controls" class="controls-well" aria-label="What the map shows"></nav>

      <figure class="frame">
        <div id="map" class="map-well">
          <!--
            What stands in the frame until the map is drawn.

            It is written here, in the document, rather than by the script — which is the whole of
            why it works. The bundle is `import`ed into the module graph (D19), so the boundaries,
            the census join and every variant arrive as one script the browser must fetch, compile
            and evaluate before a single line of the app runs; nothing the app itself could write
            would be on screen for any of it. This is markup the first paint already has, and
            `main.ts` takes it away once the country is actually drawn.

            `aria-live="polite"` rather than `role="status"` on a spinner: what a reader without
            the picture needs is the sentence, said once, when it arrives — and the sentence says
            what the page is, because "Loading" on a page about Pakistan's provinces tells a reader
            nothing they could not see.

            What it says is the page's own subject rather than a report on the machinery. The wait
            is the one moment this app has a reader's whole attention and nothing to show them, so
            it spends it saying what they are about to be looking at — which is also the only
            place that sentence appears: the masthead above is a name and a dek, and neither says
            the map is comparable across more than one ground.

            It names **the three bases a reader can actually press**, and Historical is left out
            for the reason it is off the basis strip at all (`HIDDEN_BASES` in `lib/selection.ts`):
            it has its four variants and no shading, so promising it here would be the first
            sentence of the app advertising a chip that is not on the next screen. The withholding
            is the menu entry, so H1 to H4 stay in the bundle, on the About panel and at their own
            URLs — but nothing that reads as a menu may list them, and this reads as one.
          -->
          <div id="boot" class="boot" aria-live="polite">
            <p class="boot-title">Explore alternative provincial configurations of Pakistan</p>
            <p class="boot-tagline">Compare language, administrative, and development models on a
              single interactive map.</p>
          </div>

          <!--
            The one control that sits on the map itself: whether the division tier is drawn. It is
            here rather than in the controls well because it is not part of the selection — it does
            not choose what is argued, only how much of the administrative map it is argued over —
            and because a control that changes the paper belongs on the paper.
          -->
          <div id="map-controls" class="map-controls"></div>

          <!--
            Stratum 1's key, on the paper, under the division toggle: which colour is which mother
            tongue, or which band of the development composite. The legend below the frame says the
            same thing and says it in full — this is the half a reader matches to the ground while
            still looking at the ground, which is what a fill key is for.

            Empty and gone under a basis that shades nothing, exactly as the unit key is empty at
            the baseline: three of the four bases can be selected and paint no district, and a key
            to a fill the map never drew explains a picture that does not exist.

            `aria-hidden` for the reason the unit key is: the legend under the frame carries these
            same rows, in the same words, and a screen reader given both is given every colour
            twice.
          -->
          <div id="fill-key" class="fill-key" aria-hidden="true"></div>

          <!--
            The map's own key to stratum 3: how many units the active variant cuts the country
            into, and which unit is which, in its outline's own stroke. It sits on the paper
            because that is where the outlines are — the legend under the frame says what a stroke
            *means*, and this says whose boundary it is.

            Empty and gone at the baseline, exactly as the card and the outlines are (#19): the
            current map proposes nothing, and there is nothing here to name.

            `aria-hidden`, and that is a decision rather than an oversight. The map already names
            every region in words for a screen reader (#35, `lib/regions.ts`), with each unit's
            constitutional standing beside it; this is the same list with less in it, and reading
            it out again would give a reader the units twice and the standing once.
          -->
          <!--
            The frame's left edge, as one column: the unit key, then the method note under it.

            A rail rather than two boxes each anchored to a corner, because the note has to sit
            *under* the key and the key's height is however many units the variant proposes — two
            corners cannot agree on where that is without measuring, and stacking is what the flow
            already does for free. Each box still empties itself independently, and `:empty` takes
            either one off the paper without moving the other.
          -->
          <div class="map-left-rail">
            <div id="unit-key" class="unit-key" aria-hidden="true"></div>

            <!--
              How the map on screen was built (#52), in a few sentences — directly under the unit
              key, which is the key it belongs beside: that box names the units, and this says by
              what rule they were arrived at. The card says what a variant claims and the legend says
              what a colour means; neither says how the boundary was got, which for a rule-drawn
              variant is the first thing a reader asks and until now was only in `docs/`.

              Not `aria-hidden`, which is where it differs from both keys: they repeat rows a
              screen reader already has from the legend and from `lib/regions.ts`, and this is
              prose that appears nowhere else on the page.

              Empty and gone at the baseline and under a basis with no summary written for it,
              exactly as the keys are empty when there is nothing to key.
            -->
            <aside id="method-note" class="method-note" aria-label="How this map is built"></aside>
          </div>
        </div>
        <figcaption class="legend" id="legend"></figcaption>
      </figure>

      <aside class="card-well" id="card" aria-label="The variant on screen" hidden></aside>

      <footer class="colophon" id="colophon"></footer>

      <!--
        The audit surface (#21). A `details` rather than a dialog or a route: it needs no
        JavaScript to open, no hover to discover and no width to fit, which is what makes it work
        at 390px — and it is closed by default because it is the reference behind the map, not the
        map. It sits under the colophon, which is the short form of the same claim.
      -->
      <section class="about-well" id="about"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
