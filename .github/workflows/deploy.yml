# Publish the built page to GitHub Pages.
#
# Separate from `ci.yml` rather than a job appended to it: CI runs on every branch and every
# pull request and guards the bundle's invariants, and a deploy must happen on `main` and
# nowhere else. `npm run build` type-checks before it bundles, so a broken tree never ships.
name: Deploy

on:
  push:
    branches: [main]
  # So a deploy can be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an older one still in flight, but never
# cancels a run that is already uploading.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pinned to 22 for the same reason CI is.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
